# =============================================================================
# application.properties — CONFIGURACOES DA APLICACAO
# =============================================================================
# Este arquivo e lido automaticamente pelo Spring Boot na inicializacao.
# Ele controla porta, banco de dados, JPA/Hibernate e o console H2.
# =============================================================================


# ------------------------- SERVIDOR HTTP -------------------------------------
# Porta em que a API Spring Boot sera exposta.
server.port=8080
# Nome do servidor HTTP (aparece nos cabecalhos de resposta)
server.servlet.encoding.charset=UTF-8
# Forca UTF-8 em todo o pipeline (evita problema com "ã", "ç", "é" nos dados)
server.servlet.encoding.force=true


# ------------------------- BANCO DE DADOS H2 (Aula 03) -----------------------
# URL de conexao. O H2 pode rodar em memoria (:mem:) ou em arquivo (:file:).
# Usamos ARQUIVO (database.db) para que os dados SOBREVIVAM ao reinicio da
# aplicacao — exatamente o problema apontado na Aula 03 ("os dados nao
# sobrevivem a um reinicio").
#
# IMPORTANTE para portabilidade: o arquivo database.db e criado na pasta de
# onde voce executa a aplicacao. Basta o H2 estar em "runtime" no pom.xml —
# NAO e preciso instalar nenhum banco externo.
spring.datasource.url=jdbc:h2:file:./database.db
spring.datasource.driverClassName=org.h2.Driver
# Usuario padrao do H2
spring.datasource.username=sa
# Senha vazia (padrao do H2 para estudo)
spring.datasource.password=


# ------------------------- CONSOLE H2 (Aula 03) ------------------------------
# Libera a interface web do H2 para consultar as tabelas direto no navegador.
# Acesse: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# URL JDBC exibida na tela do console H2 (deve bater com spring.datasource.url)
spring.h2.console.settings.web-allow-others=true


# ------------------------- JPA / HIBERNATE -----------------------------------
# Dialeto do banco (o Spring costuma detectar sozinho, mas explicitamos)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia de criacao/atualizacao das tabelas:
#   none      → nao faz nada (usado em producao com banco ja modelado)
#   update    → cria as tabelas que faltam e atualiza as existentes
#   create    → apaga e recria as tabelas TODA vez (perde os dados!)
#   create-drop → cria no inicio e apaga ao encerrar (usado em testes)
# Usamos "update" conforme a Aula 03: o Hibernate cria/atualiza as tabelas
# automaticamente a partir das entidades @Entity.
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL no console (otimo para estudar como o JPA gera o SQL)
spring.jpa.show-sql=true
# Formata a saida do SQL para ficar legivel
spring.jpa.properties.hibernate.format_sql=true
# Evita warnings de "N+1" em projetos com relacionamentos futuros
spring.jpa.open-in-view=false


# ------------------------- SERENIALIZACAO JSON (Jackson) ---------------------
# Serializa LocalDateTime como ISO-8601 (ex.: 2026-10-02T21:00:00)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
# Inclui campos nulos no JSON (padrao do Spring Boot 3)
spring.jackson.default-property-inclusion=non_null
# Nao quebra a aplicacao se houver propriedade desconhecida no JSON recebido
spring.jackson.fail-on-unknown-properties=false


# ------------------------- LOGS -------------------------------------------------------------------
# Nivel de log: INFO mostra os principais eventos; use DEBUG para investigar
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ------------------------- ACTUATOR (saude da aplicacao) ---------------------
# Libera os endpoints de monitoramento (saude da aplicacao)
management.endpoints.web.exposure.include=health,info
# Exibe detalhes da saude apenas em desenvolvimento
management.endpoint.health.show-details=always

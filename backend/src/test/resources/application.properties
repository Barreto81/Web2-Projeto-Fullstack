# =============================================================================
# Configuracao usada APENAS durante os testes (src/test)
# =============================================================================
# O banco de testes roda em MEMORIA e e reiniciado a cada classe de teste,
# garantindo que os testes sejam independentes e rapidos.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# CORS liberado para o MockMvc dos testes
spring.main.banner-mode=off
logging.level.org.springframework=WARN
